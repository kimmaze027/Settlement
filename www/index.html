<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Settlement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (4px-base spacing scale; all paddings/margins/gaps use it) ===== */
:root{
  --bg:#0a0a0a;
  --surface:#0f0f0f;
  --surface-2:#1a1a1a;
  --popover:#121212;
  --secondary:#1f1f1f;
  --line:#242424;
  --line-strong:#333333;
  --txt:#fafafa;
  --txt-mute:#8c8c8c;
  --txt-faint:#666666;
  --primary:#fafafa;
  --primary-fg:#171717;
  --accent:#10b981;
  --accent-2:#34d399;
  --danger:#f87171;
  --danger-strong:#dc2626;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:28px; --s-8:32px;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-pill:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:"rlig" 1,"calt" 1;-webkit-tap-highlight-color:transparent}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent-2);text-decoration:none}
.hidden{display:none!important}

/* ===== App shell ===== */
#app{max-width:500px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top)}
.screen-center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:var(--s-6) var(--s-4)}
.page-pad{padding:0 var(--s-4)}
.nav-clear{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.center{text-align:center}

/* ===== Typography ===== */
.h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.page-title{margin:var(--s-6) 0 var(--s-4)}
.h2{font-size:16px;font-weight:600;color:var(--txt-mute);line-height:1.3}
.brand{font-size:28px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--txt-faint);font-size:12px}
.field-label{font-size:12px;color:var(--txt-faint);font-weight:500}
.fmt{color:var(--txt-faint);font-size:11px}
.pos{color:var(--accent-2)}
.neg{color:var(--danger)}
.amt{font-size:18px;font-weight:600}
.name-val{font-size:16px;font-weight:500}
.stl-title{font-size:15px;font-weight:500}

/* ===== Layout helpers ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}
.col,.stack{display:flex;flex-direction:column;gap:var(--s-3)}
.stack-sm{display:flex;flex-direction:column;gap:var(--s-2)}
.actions{display:flex;align-items:center;gap:var(--s-2)}
.actions-end{display:flex;align-items:center;gap:var(--s-2);justify-content:flex-end}
.seg{display:flex;gap:var(--s-2);flex-wrap:wrap}
.form-row{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.head-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);padding:var(--s-6) var(--s-4) var(--s-4)}
.back-row{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-6) 0 var(--s-3)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);margin-bottom:var(--s-3)}
.clickable{cursor:pointer}
.self-start{align-self:flex-start}
.mt1{margin-top:var(--s-1)} .mt2{margin-top:var(--s-2)} .mt3{margin-top:var(--s-3)} .mt4{margin-top:var(--s-4)} .mt5{margin-top:var(--s-5)}
.sep{border-top:1px solid var(--line);margin:var(--s-3) 0}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-4);margin-bottom:var(--s-3)}
.card:last-child{margin-bottom:0}
.details{margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--line)}

/* ===== Inputs ===== */
.input{width:100%;padding:var(--s-3) var(--s-4);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:rgba(255,255,255,.32)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.field{margin-bottom:var(--s-3)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-1);padding:var(--s-3) var(--s-5);border:1px solid var(--line-strong);background:transparent;color:var(--txt);border-radius:var(--r-md);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:rgba(255,255,255,.06)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);font-weight:600}
.btn-primary:hover{background:#e5e5e5;border-color:#e5e5e5}
.btn-sm{padding:var(--s-2) var(--s-3);font-size:12px;border-radius:var(--r-sm)}
.btn-block{display:flex;width:100%}
.btn.neg{color:var(--danger)}

/* ===== Badge / chip ===== */
.badge{display:inline-block;padding:2px var(--s-2);border-radius:var(--r-pill);font-size:11px;background:rgba(255,255,255,.1);color:var(--txt-mute)}
.deposit-pick{margin:0 var(--s-1) var(--s-1) 0;padding:var(--s-2) var(--s-3);border:1px solid var(--line);background:transparent;color:var(--txt-mute);border-radius:var(--r-pill);font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.deposit-pick.on{border-color:rgba(16,185,129,.4);color:var(--accent-2);background:rgba(16,185,129,.15)}

/* ===== Messages ===== */
.err{color:var(--danger);font-size:12px;padding:var(--s-1) 0}
.ok{color:var(--accent-2);font-size:12px;padding:var(--s-1) 0}
.list-empty{padding:var(--s-3) 0;color:var(--txt-faint);font-size:12px}

/* ===== Checkboxes ===== */
label.cb{display:flex;align-items:center;gap:var(--s-2);cursor:pointer;padding:var(--s-2) 0}
label.cb input{width:20px;height:20px;accent-color:var(--accent)}

/* ===== Bottom nav ===== */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:rgba(9,9,11,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;background:none;border:none;color:var(--txt-faint);padding:var(--s-2) 0;font-size:11px;font-weight:500;cursor:pointer;transition:color .15s}
.nav button svg{width:24px;height:24px}
.nav button.active{color:var(--accent-2);font-weight:600}
.nav button:active{opacity:.7}

/* ===== Push toast ===== */
.push-toast{position:fixed;top:0;left:0;right:0;max-width:500px;margin:0 auto;background:var(--accent);color:#09090b;padding:var(--s-3) var(--s-4);font-size:13px;font-weight:600;z-index:999;cursor:pointer}

/* ===== Update modal (self-update) ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:var(--s-4);z-index:1000}
.modal-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:var(--s-5);width:100%;max-width:340px;display:flex;flex-direction:column;gap:var(--s-2)}
.modal-wide{max-width:420px}
.upd-ver{font-size:18px;font-weight:600;color:var(--accent-2)}
.upd-vers{display:flex;flex-direction:column;gap:var(--s-2);margin:var(--s-1) 0}
.upd-progress{display:flex;flex-direction:column;gap:var(--s-1);margin-top:var(--s-1)}
.upd-bar{height:6px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.upd-fill{height:100%;width:0;background:var(--accent);border-radius:var(--r-pill);transition:width .2s}

/* ===== App lock (PIN keypad) ===== */
.pin-dots{display:flex;gap:var(--s-3);justify-content:center;margin:var(--s-5) 0 var(--s-4)}
.pin-dots .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-strong);transition:background .1s,border-color .1s}
.pin-dots .dot.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:var(--s-3);justify-content:center;margin-top:var(--s-4)}
.keypad .key{width:64px;height:64px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--txt);font-size:24px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s}
.keypad .key:active{background:rgba(255,255,255,.12)}
.keypad .key.key-blank{border:none;background:none;cursor:default}
.actions-center{display:flex;gap:var(--s-2);justify-content:center;flex-wrap:wrap}
.lock-link{background:none;border:none;color:var(--txt-faint);font-size:12px;cursor:pointer;padding:var(--s-2);text-decoration:underline}

/* ===== Grayscale helpers ===== */
.btn-secondary{background:var(--secondary);border-color:var(--secondary);color:var(--txt)}
.btn-secondary:hover{background:#2a2a2a;border-color:#2a2a2a}
.btn-icon{padding:var(--s-2);width:34px;height:34px;border-color:transparent;background:transparent;flex:none}
.btn-icon svg{width:17px;height:17px}
.btn-danger-ghost{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger-ghost:hover{background:rgba(220,38,38,.12)}
.muted{color:var(--txt-mute)}
.emerald{color:var(--accent-2)}
.text-danger{color:var(--danger)}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{flex-wrap:wrap}
.gap-1{gap:var(--s-1)}.gap-2{gap:var(--s-2)}.gap-3{gap:var(--s-3)}
.mt1{margin-top:var(--s-1)}
.icon-sm{width:14px;height:14px;flex:none}
.icon-xs{width:12px;height:12px;flex:none}
.center{text-align:center}
.tabnum{font-variant-numeric:tabular-nums}

/* ===== Card title ===== */
.card-title{display:flex;align-items:center;gap:var(--s-2);font-size:14px;font-weight:600;margin-bottom:var(--s-3)}

/* ===== Badge variants ===== */
.badge-success{background:rgba(16,185,129,.15);color:var(--accent-2)}
.badge-warning{background:rgba(220,38,38,.15);color:var(--danger)}
.badge-outline{background:transparent;border:1px solid var(--line-strong);color:var(--txt-mute)}
.badge svg{width:11px;height:11px;vertical-align:-1px;margin-right:2px}

/* ===== Member rows ===== */
.mem{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:none}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--txt-mute)}

/* ===== Invite code ===== */
.code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s-2) var(--s-3);font-size:11px;color:var(--txt-mute);font-family:ui-monospace,monospace}

/* ===== Balance stat cards ===== */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-4)}
.stat.wide{grid-column:1 / -1}
.stat-lbl{display:flex;align-items:center;gap:var(--s-1);font-size:11px;color:var(--txt-mute)}
.stat-val{display:block;margin-top:var(--s-2);font-size:22px;font-weight:600}
.stat-pos{border-color:rgba(16,185,129,.2);background:rgba(16,185,129,.04)}
.stat-pos .stat-val{color:var(--accent-2)}
.stat-neg{border-color:rgba(220,38,38,.2);background:rgba(220,38,38,.04)}
.stat-neg .stat-val{color:var(--danger)}
.toglink{display:inline-flex;align-items:center;gap:var(--s-1);background:none;border:none;color:var(--txt-mute);font-size:12px;cursor:pointer;padding:var(--s-2) 0}
.toglink svg{width:14px;height:14px;transition:transform .15s}
.toglink.open svg{transform:rotate(180deg)}

/* ===== Settlement list card ===== */
.stl-card{cursor:pointer;transition:border-color .15s,background .15s}
.stl-card:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.02)}
.stl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-3)}
.recv-link{display:inline-flex;align-items:center;gap:var(--s-1);color:var(--accent-2);font-size:12px}

/* ===== Segmented / split ===== */
.seg-btn{flex:1}
.split-box{display:flex;flex-direction:column;gap:var(--s-3);background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-3)}
.split-row{display:flex;align-items:center;gap:var(--s-3);padding:2px 0}
.split-row label{flex:1;display:flex;align-items:center;gap:var(--s-2);cursor:pointer}
.split-amt{width:120px;text-align:right;padding:var(--s-2) var(--s-3)}
.split-sum{display:flex;align-items:center;justify-content:space-between;font-size:12px}

/* ===== Upload / select ===== */
.upload{display:flex;align-items:center;gap:var(--s-2);border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:var(--s-3);color:var(--txt-mute);cursor:pointer;font-size:13px}
.upload:hover{color:var(--txt);border-color:rgba(255,255,255,.4)}
.upload svg{width:16px;height:16px;flex:none}
.select{width:100%;padding:var(--s-3) var(--s-4);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--txt);appearance:none}

/* ===== Right-slide sheet ===== */
.sheet{position:fixed;inset:0;z-index:1000;display:flex;justify-content:flex-end;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet-panel{width:min(100%,440px);height:100%;background:var(--surface);border-left:1px solid var(--line-strong);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top)}
.sheet.open .sheet-panel{transform:translateX(0)}
.sheet-head{padding:var(--s-5);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-3)}
.sheet-title{font-size:17px;font-weight:600}
.sheet-desc{display:flex;align-items:center;gap:var(--s-1);color:var(--txt-faint);font-size:12px;margin-top:2px}
.sheet-close{background:none;border:none;color:var(--txt-mute);font-size:20px;cursor:pointer;line-height:1;padding:0 var(--s-1)}
.sheet-body{flex:1;overflow-y:auto;padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-6);padding-bottom:calc(var(--s-6) + env(safe-area-inset-bottom))}

/* ===== Progress / detail ===== */
.prog{height:6px;border-radius:var(--r-pill);background:var(--line);overflow:hidden}
.prog-fill{height:100%;border-radius:var(--r-pill);background:var(--accent)}
.prog-fill.part{background:rgba(16,185,129,.6)}
.dsplit{display:flex;flex-direction:column;gap:var(--s-2);border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:var(--r-md);padding:var(--s-3)}
.receipt-img{max-height:280px;width:100%;object-fit:contain;border:1px solid var(--line);border-radius:var(--r-md);background:rgba(255,255,255,.02)}

/* ===== History rows ===== */
.hrow{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) 0}
.hicon{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hicon svg{width:16px;height:16px}
.hicon.in{background:rgba(16,185,129,.15);color:var(--accent-2)}
.hicon.out{background:rgba(220,38,38,.15);color:var(--danger)}
.hday{font-size:12px;color:var(--txt-mute);font-weight:500;margin-bottom:var(--s-1)}

/* ===== Modal scroll ===== */
.modal-scroll{max-height:82vh;overflow-y:auto}
</style>
</head>
<body>
<div id="app">
<!-- LOGIN SCREEN -->
<div id="screen-login" class="screen-center">
  <h1 class="brand center">Settlement</h1>
  <button id="google-btn" class="btn btn-primary btn-block mt4" onclick="googleLogin()">Google 로그인</button>
  <div id="google-err" class="err center mt2"></div>
</div>

<!-- LOCK SCREEN (biometric/PIN re-entry gate) -->
<div id="screen-lock" class="screen-center hidden">
  <h1 class="brand center">Settlement</h1>
  <p id="lock-msg" class="sub center mt2">PIN을 입력하세요</p>
  <div id="lock-dots" class="pin-dots"></div>
  <div id="lock-keypad" class="keypad"></div>
  <div class="actions-center mt3">
    <button id="lock-bio" class="btn btn-sm" onclick="lockBiometric()">지문 인증</button>
  </div>
  <button class="lock-link mt2" onclick="lockReset()">다른 계정으로 로그인</button>
  <div id="lock-err" class="err center mt2"></div>
</div>

<!-- PIN SETUP SCREEN (first-time enrollment) -->
<div id="screen-pinsetup" class="screen-center hidden">
  <h1 class="brand center">Settlement</h1>
  <p id="pinsetup-msg" class="sub center mt2">PIN을 설정하세요 (4자리)</p>
  <div id="pinsetup-dots" class="pin-dots"></div>
  <div id="pinsetup-keypad" class="keypad"></div>
  <label class="cb mt3" id="pinsetup-bio-wrap" style="justify-content:center"><input type="checkbox" id="pinsetup-bio"> 지문 인증 사용</label>
  <div id="pinsetup-err" class="err center mt2"></div>
</div>

<!-- MAIN APP -->
<div id="screen-main" class="hidden nav-clear">
  <!-- GROUPS -->
  <div id="view-groups">
    <div class="head-bar">
      <h1 class="h1">그룹</h1>
      <div class="row gap-2">
        <button class="btn btn-sm" onclick="promptJoin()">참여</button>
        <button class="btn btn-primary btn-sm" onclick="toggleCreate()">+ 그룹 만들기</button>
      </div>
    </div>
    <div id="create-form" class="card hidden stack-sm">
      <input id="gp-name" class="input" placeholder="그룹 이름">
      <button class="btn btn-primary btn-sm self-start" onclick="createGroup()">생성</button>
    </div>
    <div id="group-list" class="page-pad"></div>
  </div>

  <!-- GROUP DETAIL -->
  <div id="view-detail" class="hidden page-pad">
    <div class="back-row">
      <button class="btn btn-sm" onclick="showGroups()">← 목록으로</button>
    </div>
    <div class="row" style="align-items:flex-start">
      <div class="grow">
        <h1 class="h1 truncate" id="detail-name"></h1>
        <div class="sub" id="detail-created" style="margin-top:2px"></div>
      </div>
      <button id="detail-del" class="btn btn-icon btn-danger-ghost" style="display:none" aria-label="그룹 삭제" onclick="deleteGroup()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
    <div class="sep"></div>

    <!-- Invite -->
    <div class="card">
      <div class="card-title"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></svg> 초대 링크</div>
      <button class="btn btn-primary btn-sm self-start" id="invite-btn" onclick="createInvite()">초대 링크 생성</button>
      <div id="invite-msg" class="mt1"></div>
      <div id="invite-box" class="hidden stack-sm mt3">
        <code class="code" id="invite-url"></code>
        <button class="btn btn-sm self-start" id="invite-copy" onclick="copyInvite()">링크 복사</button>
      </div>
    </div>

    <!-- Members -->
    <div class="card">

<script>
const API = "https://api.kimmiro.com";
let myId = null, myRole = "", myFeatures = [], currentGid = null, currentGroup = null, groupMembers = [], currentSettlements = [], currentBalance = null, currentPayments = [], inviteUrl = null;
let fMode = "all", fSplit = "equal", fSelected = [], fCustom = {}, fEditing = null, fReceiptFile = null, fRemoveReceipt = false;
let depSelUid = null, depDebtors = [];

// --- API helpers ---
async function api(path, opts = {}) {
  const r = await fetch(`${API}${path}`, { ...opts, credentials: "include" });
  if (!r.ok && r.status !== 201) throw { status: r.status, ...(await r.json().catch(() => ({}))) };
  return r;
}
const won = n => (n < 0 ? "−" : "") + "₩" + Math.abs(n || 0).toLocaleString();
const fmtDate = s => { try { return new Date(s).toLocaleDateString("ko-KR"); } catch { return ""; } };
const esc = s => (s || "").replace(/</g, "&lt;");

// --- GOOGLE NATIVE LOGIN ---
// Why this is non-trivial: GoogleAuth.signIn() opens a separate system Activity
// (account picker). While it is foregrounded the app is backgrounded and Android
// frequently kills the app process to reclaim memory. The JS `await signIn()`
// promise is destroyed with the page, so the idToken never reaches the server, no
// session cookie is set, and the app relaunches to the login screen (looks like a
// crash). To survive this we record "in-flight" in Preferences and, on the next
// launch, silently recover the persisted native account via refresh().
const PREF_G_INFLIGHT = "google_login_inflight";
const pref = {
  get: (k) => Capacitor.Plugins.Preferences.get({ key: k }).then((r) => r.value),
  set: (k, v) => Capacitor.Plugins.Preferences.set({ key: k, value: v }),
  del: (k) => Capacitor.Plugins.Preferences.remove({ key: k }),
};

// Exchange a Google idToken for a session cookie, then enter the app.
async function completeGoogleLogin(idToken) {
  const res = await fetch(`${API}/api/auth/google/token`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: idToken }),
    credentials: "include",
  });
  if (!res.ok) throw new Error("server rejected token (" + res.status + ")");
  await init();
}

// Silent recovery for when a previous Google login was interrupted by process
// death. The native GoogleSignInClient keeps the signed-in account, so refresh()
// returns a fresh idToken with no UI. Returns true if the app ended up logged in.
async function recoverGoogleLogin() {
  if ((await pref.get(PREF_G_INFLIGHT)) !== "1") return false;
  try {
    const { GoogleAuth } = Capacitor.Plugins;
    await GoogleAuth.initialize();
    const auth = await GoogleAuth.refresh();
    const idToken = auth?.idToken;
    if (!idToken) throw new Error("no id_token on refresh");
    await completeGoogleLogin(idToken);
    await pref.del(PREF_G_INFLIGHT);
    return true;
  } catch {
    // Not actually signed in / revoked / network — clear the flag and fall through
    // to normal init() so the user lands on the login screen, not a silent loop.
    try { await pref.del(PREF_G_INFLIGHT); } catch {}
    return false;
  }
}

async function googleLogin() {
  const err = document.getElementById("google-err");
  err.textContent = "";
  try {
    const { GoogleAuth } = Capacitor.Plugins;
    await GoogleAuth.initialize();
    // Prefer SILENT sign-in first: refresh() (now backed by silentSignIn()) returns a fresh
    // idToken with NO UI. This avoids launching the system account-picker Activity, which
    // backgrounds the app and lets Android kill the process (the #1 cause of login silently
    // failing). Only when there is no cached consent (first-ever login / cleared data) do we
    // fall back to the interactive signIn() picker.
    let idToken = null;
    try {
      const silent = await GoogleAuth.refresh();
      idToken = silent?.idToken || null;
    } catch {}
    if (!idToken) {
      // Mark in-flight BEFORE leaving the app, so a mid-sign-in process kill is recoverable.
      await pref.set(PREF_G_INFLIGHT, "1");
      const result = await GoogleAuth.signIn();
      await pref.del(PREF_G_INFLIGHT);
      idToken = result.authentication?.idToken;
    }
    if (!idToken) throw { code: 0, message: "no id_token" };
    await completeGoogleLogin(idToken);
  } catch (e) {
    try { await pref.del(PREF_G_INFLIGHT); } catch {}
    const code = Number(e.code ?? e.status ?? -99);
    const msgs = {
      4: "구글 계정 선택 필요",
      5: "로그인 취소됨",
      7: "네트워크 오류",
      8: "Google Play Services 오류",
      10: "설정 오류 (DEVELOPER_ERROR) — Google Cloud Console에 SHA-1 지문 + 패키지명(com.kimmiro.app) 등록 필요",
      12500: "Google Play Services 버전 확인 필요",
      12501: "로그인 취소",
    };
    err.textContent = msgs[code] || ("구글 로그인 실패 [code=" + code + "]: " + (e.message || ""));
  }
}

// --- INIT ---
// After confirming a valid server session, entry is gated behind the local app lock
// (PIN, optional biometric) — NOT silent auto-login. First login forces PIN enrollment.
async function init() {
  try {
    const r = await api("/api/auth/me");
    const d = await r.json();
    if (d.username_customized === false) {
      // force nickname setup first
      const nn = prompt("닉네임을 설정하세요 (3~20자 영문/숫자/_/-)");
      if (nn) {
        await api("/api/me/username", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: nn.trim() }) });
      }
    }
    myId = d.id;
    myRole = d.role || ""; myFeatures = d.features || [];
    document.getElementById("my-name").textContent = d.username;
    // Valid session: require a PIN (enroll on first login), then gate every reopen.
    const hash = await pref.get("pin_hash");
    if (!hash) showPinSetup();
    else showLock();
  } catch {
    // No valid session -> show the Google-only login screen.
    showScreen("login");
  }
}

// --- APP LOCK (biometric / PIN re-entry gate) ---
// The server session cookie proves the account; this local gate proves the device
// owner is present. PIN (SHA-256 hashed, stored in Preferences) is always available;
// biometric (BiometricPrompt) is an optional convenience that auto-prompts if enabled.
const PIN_LEN = 4;
let lockCtrl = null, pinSetupCtrl = null, pinSetupFirst = null, pinSetupMode = "enroll";

function showScreen(name) {
  ["login", "lock", "pinsetup", "main"].forEach(s => document.getElementById("screen-" + s).classList.add("hidden"));
  document.getElementById("screen-" + name).classList.remove("hidden");
}
function enterApp() {
  showScreen("main");
  // Deterministic entry state: show the groups view with its tab active (this also
  // loads groups). Without it the default markup could leave several views stacked.
  showView("groups");
  registerPush();
  syncLockSettings();
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "push-toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
// Enable biometric only after a successful in-app fingerprint check; persists the
// flag on success and clears it on any failure/cancel. Used at PIN enrollment and
// from the My Info toggle.
async function tryEnableBiometric() {
  try {
    await Capacitor.Plugins.Biometric.authenticate({ title: "Settlement", subtitle: "지문 인증" });
    await pref.set("biometric_enabled", "1");
    return true;
  } catch {
    await pref.set("biometric_enabled", "0");
    return false;
  }
}
// Reflect current biometric availability/enabled state into the My Info toggle.
async function syncLockSettings() {
  const avail = await bioAvailable();
  const row = document.getElementById("bio-row");
  if (row) row.style.display = avail ? "" : "none";
  if (avail) document.getElementById("bio-toggle").checked = (await pref.get("biometric_enabled")) === "1";
}
async function toggleBio() {
  const cb = document.getElementById("bio-toggle");
  const enabled = (await pref.get("biometric_enabled")) === "1";
  if (cb.checked && !enabled) {
    const ok = await tryEnableBiometric();
    cb.checked = ok;
    if (!ok) toast("지문 인증 실패 — 생체인증을 켜지 못했습니다");
  } else if (!cb.checked && enabled) {
    await pref.set("biometric_enabled", "0");
  }
}
function changePin() {
  showPinSetup("change");
}

async function pinHash(pin) {
  const data = new TextEncoder().encode("settlement-pin-v1:" + pin);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function bioAvailable() {
  try {
    const B = Capacitor.Plugins.Biometric;
    if (!B) return false;
    return !!(await B.isAvailable()).available;
  } catch { return false; }
}

// Renders a numeric keypad + PIN dots; calls onComplete(pin) when PIN_LEN digits entered.
function makePinInput(dotsId, keypadId, onComplete) {
  let entry = "";
  const dots = document.getElementById(dotsId);
  const kp = document.getElementById(keypadId);
  function render() {
    dots.innerHTML = Array.from({ length: PIN_LEN }, (_, i) => '<span class="dot ' + (i < entry.length ? "on" : "") + '"></span>').join("");
  }
  const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  kp.innerHTML = keys.map(k => k === "" ? '<button class="key key-blank" disabled></button>'
    : '<button class="key" data-k="' + k + '">' + (k === "del" ? "⌫" : k) + "</button>").join("");
  kp.querySelectorAll(".key[data-k]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k;
    if (k === "del") entry = entry.slice(0, -1);
    else if (entry.length < PIN_LEN) entry += k;
    render();
    if (entry.length === PIN_LEN) { const p = entry; entry = ""; render(); onComplete(p); }
  }));
  render();
  return { reset: () => { entry = ""; render(); } };
}

async function showLock() {
  showScreen("lock");
  document.getElementById("lock-err").textContent = "";
  document.getElementById("lock-msg").textContent = "PIN을 입력하세요";
  lockCtrl = makePinInput("lock-dots", "lock-keypad", onLockPin);
  const avail = await bioAvailable();
  const enabled = (await pref.get("biometric_enabled")) === "1";
  document.getElementById("lock-bio").style.display = avail ? "" : "none";
  if (avail && enabled) lockBiometric(); // auto-prompt when enabled
}
async function onLockPin(pin) {
  if ((await pinHash(pin)) === (await pref.get("pin_hash"))) {
    enterApp();
  } else {
    document.getElementById("lock-err").textContent = "PIN이 틀렸습니다";
    if (lockCtrl) lockCtrl.reset();
  }
}
async function lockBiometric() {
  try {
    await Capacitor.Plugins.Biometric.authenticate({ title: "Settlement", subtitle: "잠금 해제" });
    enterApp();
  } catch { /* canceled / failed -> stay on PIN entry */ }
}
// Wipes everything so the next login is from scratch: clears the Google consent (so the
// account picker shows again instead of a silent auto-login), the server session, and the
// local PIN/biometric lock.
async function fullLogout() {
  try { const { GoogleAuth } = Capacitor.Plugins; if (GoogleAuth) await GoogleAuth.signOut(); } catch {}
  try { await api("/api/auth/logout", { method: "POST" }); } catch {}
  try { await pref.del("pin_hash"); await pref.del("biometric_enabled"); } catch {}
}
async function lockReset() {
  // Full reset: Google consent + server session + local lock. Used for account switch or
  // forgotten-PIN recovery; the next login re-enrolls PIN from scratch.
  if (!confirm("로그아웃하고 PIN을 초기화할까요?")) return;
  await fullLogout();
  showScreen("login");
}

async function showPinSetup(mode) {
  pinSetupMode = mode || "enroll";
  showScreen("pinsetup");
  pinSetupFirst = null;
  document.getElementById("pinsetup-msg").textContent = pinSetupMode === "change" ? "새 PIN을 입력하세요 (4자리)" : "PIN을 설정하세요 (4자리)";
  document.getElementById("pinsetup-err").textContent = "";
  const wrap = document.getElementById("pinsetup-bio-wrap");
  if (pinSetupMode === "change") {
    wrap.style.display = "none";
  } else {
    const avail = await bioAvailable();
    wrap.style.display = avail ? "flex" : "none";
    document.getElementById("pinsetup-bio").checked = avail;
  }
  pinSetupCtrl = makePinInput("pinsetup-dots", "pinsetup-keypad", onPinSetup);
}
async function onPinSetup(pin) {
  const msg = document.getElementById("pinsetup-msg");
  const err = document.getElementById("pinsetup-err");
  if (!pinSetupFirst) {
    pinSetupFirst = pin;
    msg.textContent = "다시 한번 입력하세요";
    err.textContent = "";
    if (pinSetupCtrl) pinSetupCtrl.reset();
  } else if (pin === pinSetupFirst) {
    await pref.set("pin_hash", await pinHash(pin));
    pinSetupFirst = null;
    if (pinSetupMode === "enroll") {
      // If the user opted into biometric, verify it works once before relying on it;
      // on any failure the biometric option stays OFF (PIN remains the gate).
      if (document.getElementById("pinsetup-bio").checked && await bioAvailable()) {
        if (!(await tryEnableBiometric())) toast("지문 인증 실패 — 생체인증이 꺼졌습니다");
      } else {
        await pref.set("biometric_enabled", "0");
      }
      enterApp();
    } else {
      toast("PIN이 변경되었습니다");
      showScreen("main");
      showView("mypage");
    }
  } else {
    err.textContent = "PIN이 일치하지 않습니다. 다시 설정하세요.";
    pinSetupFirst = null;

// --- PUSH NOTIFICATIONS ---
// Wires @capacitor/push-notifications to the backend FCM path:
//   1. request runtime permission (POST_NOTIFICATIONS, targetSdk 36)
//   2. register with FCM -> on "registration" send the token to
//      POST /api/me/device-token so the backend can target this device
//   3. on "pushNotificationReceived" show an in-app toast banner while open.
// NOTE: requires google-services.json in android/app/ (Firebase project wired
// to package com.kimmiro.app). Without it FirebaseApp is never initialized and
// PushNotifications.register() throws IllegalStateException. See HANDOFF.
async function registerPush() {
  try {
    const { PushNotifications } = Capacitor.Plugins;
    let perm = await PushNotifications.checkPermissions();
    if (perm.receive === "prompt") perm = await PushNotifications.requestPermissions();
    if (perm.receive !== "granted") return;
    await PushNotifications.register();
    PushNotifications.addListener("registration", async (token) => {
      try {
        await fetch(`${API}/api/me/device-token`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token.value, platform: "android" }),
          credentials: "include",
        });
      } catch {}
    });
    PushNotifications.addListener("pushNotificationReceived", (notification) => {
      if (notification.title) {
        const t = document.createElement("div");
        t.className = "push-toast";
        t.textContent = notification.title + (notification.body ? ": " + notification.body : "");
        t.onclick = () => { t.remove(); if (currentGid) loadSettlements(); };
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 5000);
      }
    });
  } catch {}
}

function computeEqualSplit(total, ids) {
  const n = ids.length; if (!n) return [];
  const base = Math.floor(total / n), rem = total - base * n;
  return ids.map((id, i) => ({ user_id: id, amount: base + (i < rem ? 1 : 0) }));
}

  document.getElementById("form-submit").textContent = fEditing ? "수정" : "요청";
  document.getElementById("form-err").textContent = "";
  document.getElementById("sf-receipt").value = "";
  document.getElementById("sf-total").value = fEditing ? Number(fEditing.total_amount).toLocaleString() : "";
  document.getElementById("sf-merchant").value = fEditing ? fEditing.merchant : "";
  document.getElementById("sf-reason").value = fEditing ? fEditing.reason : "";
  if (fEditing && fEditing.target_mode === "selected") {
    fSelected = fEditing.splits.map(s => s.user_id);
    fCustom = {}; fEditing.splits.forEach(s => fCustom[s.user_id] = String(s.amount_owed));
    const first = fEditing.splits[0] ? fEditing.splits[0].amount_owed : 0;
    fSplit = (fEditing.splits.length > 1 && fEditing.splits.some(s => s.amount_owed !== first)) ? "custom" : "equal";
  } else {

  const clr = document.getElementById("receipt-clear");
  clr.classList.toggle("hidden", !hasR); clr.textContent = "영수증 제거";
  setMode(fEditing ? fEditing.target_mode : "all");
  document.getElementById("form-modal").classList.remove("hidden");
}

function fTotal() { return parseInt(document.getElementById("sf-total").value.replace(/[^\d]/g, "")) || 0; }

function setSplit(s) {
  fSplit = s;

  document.getElementById("split-cu").className = "btn btn-sm seg-btn" + (s === "custom" ? " btn-primary" : "");

  document.getElementById("fill-eq").classList.toggle("hidden", s !== "custom");

  if (s === "custom") fillEqual();

}
function fillEqual() {
  computeEqualSplit(fTotal(), fSelected).forEach(s => fCustom[s.user_id] = String(s.amount));
  renderSplitRows(); updateSplitSum();
}
function toggleMember(uid, checked) {
  if (checked) { if (!fSelected.includes(uid)) fSelected.push(uid); }
  else { fSelected = fSelected.filter(u => u !== uid); }
  if (fSplit === "custom") {
    if (!checked) delete fCustom[uid];
    else if (!fCustom[uid]) {
      const sh = computeEqualSplit(fTotal(), fSelected).find(s => s.user_id === uid);
      fCustom[uid] = String(sh ? sh.amount : 0);
    }
  }
  renderSplitRows(); updateSplitSum();
}
function renderSplitRows() {
  const eq = fSplit === "equal" && fSelected.length ? new Map(computeEqualSplit(fTotal(), fSelected).map(s => [s.user_id, s.amount])) : null;
  document.getElementById("split-rows").innerHTML = groupMembers.map(m => {
    const checked = fSelected.includes(m.user_id);
    const amt = fSplit === "equal" && checked ? (eq ? eq.get(m.user_id) || 0 : 0) : (parseInt(fCustom[m.user_id] || "0") || 0);
    let right = "";
    if (checked && fSplit === "custom") right = `<input class="input split-amt" inputmode="numeric" value="${fCustom[m.user_id] ? Number(fCustom[m.user_id]).toLocaleString() : ""}" placeholder="금액" oninput="onCustomInput(${m.user_id}, this)">`;
    else if (checked && fSplit === "equal") right = `<span class="sub">${won(amt)}</span>`;
    return `<div class="split-row"><label><input type="checkbox" ${checked ? "checked" : ""} onchange="toggleMember(${m.user_id}, this.checked)" style="width:18px;height:18px;accent-color:var(--accent)"> ${esc(m.username)}</label>${right}</div>`;
  }).join("");
}
// Update fCustom + running sum WITHOUT re-rendering rows (keeps input focus).
function onCustomInput(uid, el) {

  if (fSplit !== "custom") return;

async function submitForm() {
  const err = document.getElementById("form-err"); err.textContent = "";
  const total = fTotal();
  const merchant = document.getElementById("sf-merchant").value.trim();
  const reason = document.getElementById("sf-reason").value.trim();
  if (total <= 0) { err.textContent = "전체금액을 입력하세요"; return; }
  if (total > 1000000000) { err.textContent = "전체금액은 10억 원 이하여야 합니다"; return; }
  if (!merchant) { err.textContent = "사용처를 입력하세요"; return; }
  if (merchant.length > 200) { err.textContent = "사용처는 200자 이하여야 합니다"; return; }
  if (reason.length > 1000) { err.textContent = "사유는 1000자 이하여야 합니다"; return; }
  const body = { total_amount: total, merchant, reason, target_mode: fMode };
  if (fMode === "selected") {
    if (!fSelected.length) { err.textContent = "대상 멤버를 선택하세요"; return; }
    let splits;
    if (fSplit === "equal") splits = computeEqualSplit(total, fSelected);
    else {
      splits = fSelected.map(u => ({ user_id: u, amount: parseInt(fCustom[u] || "0") || 0 }));
      if (splits.some(s => s.amount <= 0)) { err.textContent = "멤버별 금액은 1원 이상이어야 합니다"; return; }
      const sum = splits.reduce((a, b) => a + b.amount, 0);
      if (sum !== total) { err.textContent = `멤버별 금액 합계(=${won(sum)})가 전체금액과 다릅니다`; return; }
    }
    body.splits = splits;
  }
  const btn = document.getElementById("form-submit"); btn.disabled = true;
  try {
    const url = fEditing ? `/api/groups/${currentGid}/settlements/${fEditing.id}` : `/api/groups/${currentGid}/settlements`;
    const r = await api(url, { method: fEditing ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const saved = await r.json().catch(() => null);
    const sid = fEditing ? fEditing.id : (saved ? saved.id : null);
    // Attach/replace/remove the receipt against the saved id. A receipt failure is
    // surfaced but does not roll back the settlement save.
    if (sid != null) {
      const rurl = `${API}/api/groups/${currentGid}/settlements/${sid}/receipt`;
      try {
        if (fReceiptFile) {
          const fd = new FormData(); fd.append("file", fReceiptFile);
          const up = await fetch(rurl, { method: "POST", credentials: "include", body: fd });
          if (!up.ok) { const d = await up.json().catch(() => ({})); alert(d.error || "영수증 업로드 실패"); }
        } else if (fEditing && fRemoveReceipt && fEditing.has_receipt) {
          await fetch(rurl, { method: "DELETE", credentials: "include" });
        }
      } catch { alert("영수증 처리 실패"); }
    }
    closeForm(); await loadSettlements();
  } catch (e) { err.textContent = e.error || "저장 실패"; }
  finally { btn.disabled = false; }
}
function editSettlement(sid) { const s = currentSettlements.find(x => x.id === sid); if (s) openForm(s); }
async function delSettlement(sid) {
  if (!confirm("이 정산 요청을 삭제할까요?")) return;
  try { await api(`/api/groups/${currentGid}/settlements/${sid}`, { method: "DELETE" }); } catch (e) { alert(e.error || "삭제 실패"); }
  await loadSettlements();
}

// --- SETTLEMENT DETAIL DRAWER ---
function openDetail(sid) {
  const s = currentSettlements.find(x => x.id === sid); if (!s) return;
  let created = "";
  try { created = new Date(s.created_at).toLocaleString("ko-KR", { year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch {}
  document.getElementById("ds-title").textContent = s.merchant;
  document.getElementById("ds-date").textContent = created;
  const rurl = `${API}/api/groups/${currentGid}/settlements/${s.id}/receipt`;
  const splits = (s.splits || []).map(sp => {
    const rem = sp.amount_owed - sp.paid_amount, done = rem <= 0;
    const pct = sp.amount_owed > 0 ? Math.min(100, Math.round(sp.paid_amount / sp.amount_owed * 100)) : 0;
    const prog = sp.paid_amount > 0 ? `<div class="prog"><div class="prog-fill ${done ? "" : "part"}" style="width:${pct}%"></div></div><div class="row"><span class="sub">입금 ${won(sp.paid_amount)}</span><span class="${done ? "emerald" : "text-danger"}" style="font-size:12px">${done ? "완료" : "남음 " + won(rem)}</span></div>` : "";
    return `<div class="dsplit"><div class="row"><span class="truncate">${esc(sp.username)}${sp.user_id === s.requester_user_id ? '<span class="sub"> · 청구자</span>' : ""}</span><span style="font-weight:500;flex:none">${won(sp.amount_owed)}</span></div>${prog}</div>`;
  }).join("");
  const receipt = s.has_receipt
    ? `<a href="${rurl}" target="_blank" rel="noopener"><img class="receipt-img" src="${rurl}?t=${Date.now()}" alt="영수증 미리보기" onerror="this.outerHTML='<span class=&quot;recv-link&quot;>영수증 원본 보기 (새 창)</span>'"></a>`
    : '<span class="sub">첨부된 영수증이 없습니다.</span>';
  document.getElementById("ds-body").innerHTML = `
    <div class="stack-sm"><span class="sub">전체 금액</span><span style="font-size:28px;font-weight:600">${won(s.total_amount)}</span>
      <div class="row wrap gap-2" style="justify-content:flex-start"><span class="badge">${s.target_mode === "all" ? "전체 청구" : "선택 멤버"}</span><span class="sub">청구자 ${esc(s.requester_username)}</span></div>
      ${s.reason ? `<span class="sub">${esc(s.reason)}</span>` : ""}
    </div>
    <div class="stack-sm"><span class="sub">멤버별 청구 (${(s.splits || []).length}명)</span><div class="stack">${splits}</div></div>
    <div class="stack-sm"><span class="sub">영수증</span>${receipt}</div>`;
  document.getElementById("detail-sheet").classList.add("open");
}
function closeDetailSheet(e) { if (e && e.target !== e.currentTarget) return; document.getElementById("detail-sheet").classList.remove("open"); }

// --- HISTORY DRAWER ---
function openHistory() {
  const ps = [...currentPayments].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const totalIn = currentPayments.filter(p => p.requester_user_id === myId).reduce((a, b) => a + b.amount, 0);
  const totalOut = currentPayments.filter(p => p.requester_user_id !== myId).reduce((a, b) => a + b.amount, 0);
  const dayLabel = d => {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const that = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const diff = Math.round((today - that) / 86400000);
    if (diff === 0) return "오늘";
    if (diff === 1) return "어제";
    return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
  };
  const groups = [];
  ps.forEach(p => {
    const d = new Date(p.created_at);
    const k = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const last = groups[groups.length - 1];
    if (last && last.key === k) last.items.push(p);
    else groups.push({ key: k, label: dayLabel(d), items: [p] });
  });
  const body = groups.length ? groups.map(g => `<div class="stack-sm"><span class="hday">${g.label}</span><div>${g.items.map(p => {
    const recv = p.requester_user_id === myId;
    const who = recv ? p.from_username : p.requester_username;
    let time = ""; try { time = new Date(p.created_at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }); } catch {}
    return `<div class="hrow"><span class="hicon ${recv ? "in" : "out"}">${recv ? ICON.adl : ICON.aur}</span><div class="grow stack-sm" style="gap:0"><span class="truncate"><b>${esc(who)}</b>${recv ? "님에게서 받음" : "님에게 보냄"}</span><span class="sub">${time}</span></div><span class="${recv ? "emerald" : "text-danger"}" style="font-weight:600;flex:none">${recv ? "+" : "−"}${won(p.amount)}</span></div>`;
  }).join("")}</div></div>`).join("") : '<div class="center muted" style="padding:var(--s-8) 0">거래 내역이 없습니다.</div>';
  document.getElementById("hs-body").innerHTML = `
    <div class="stats" style="margin:0">
      <div class="stat stat-pos"><span class="stat-lbl">${ICON.adl}받은 금액</span><span class="stat-val" style="font-size:18px">${won(totalIn)}</span></div>
      <div class="stat stat-neg"><span class="stat-lbl">${ICON.aur}보낸 금액</span><span class="stat-val" style="font-size:18px">${won(totalOut)}</span></div>
    </div>${body}`;
  document.getElementById("history-sheet").classList.add("open");
}
function closeHistorySheet(e) { if (e && e.target !== e.currentTarget) return; document.getElementById("history-sheet").classList.remove("open"); }

// --- DEPOSIT MODAL (member select + FIFO) ---
function fmtAmt(el) { const raw = el.value.replace(/[^\d]/g, ""); el.value = raw ? Number(raw).toLocaleString() : ""; }
function openDeposit() {
  const raw = (currentBalance && currentBalance.breakdown && currentBalance.breakdown.owed_to_me) || [];
  depDebtors = [...raw].sort((a, b) => b.amount - a.amount);
  document.getElementById("deposit-err").textContent = "";
  const body = document.getElementById("deposit-body"), submit = document.getElementById("deposit-submit");
  if (!depDebtors.length) {
    body.innerHTML = '<div class="center muted" style="padding:var(--s-5) 0">받을 금액이 없습니다.</div>';
    submit.style.display = "none";
  } else {
    submit.style.display = "";
    depSelUid = depDebtors[0].user_id;
    body.innerHTML = `
      <div class="stack-sm"><label class="field-label" for="dep-sel">받은 사람</label>
        <select id="dep-sel" class="select" onchange="onDepSel()">${depDebtors.map(d => `<option value="${d.user_id}">${esc(d.username)} (${won(d.amount)})</option>`).join("")}</select></div>
      <div class="row" id="dep-owe" style="background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s-2) var(--s-3)"></div>
      <div class="stack-sm"><label class="field-label" for="deposit-amount">받은 금액 (원)</label>
        <input id="deposit-amount" class="input" placeholder="금액 입력" inputmode="numeric" oninput="fmtAmt(this)"></div>`;
    onDepSel();
  }
  document.getElementById("deposit-modal").classList.remove("hidden");
}
function onDepSel() {
  depSelUid = parseInt(document.getElementById("dep-sel").value);
  const d = depDebtors.find(x => x.user_id === depSelUid);
  document.getElementById("dep-owe").innerHTML = d ? `<span class="sub">${esc(d.username)}의 미수금</span><span class="emerald" style="font-weight:500">${won(d.amount)}</span>` : "";
}
function closeDeposit() { document.getElementById("deposit-modal").classList.add("hidden"); }
async function submitDeposit() {
  const e = document.getElementById("deposit-err"); e.textContent = "";
  const amt = parseInt(document.getElementById("deposit-amount").value.replace(/[^\d]/g, "")) || 0;
  const d = depDebtors.find(x => x.user_id === depSelUid);
  if (!depSelUid || amt <= 0) { e.textContent = "멤버와 금액을 입력하세요"; return; }
  if (d && amt > d.amount) { e.textContent = `받은 금액은 미수금(${won(d.amount)}) 이하여야 합니다`; return; }
  const btn = document.getElementById("deposit-submit"); btn.disabled = true;
  try {
    await api(`/api/groups/${currentGid}/settlements/payment`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from_user_id: depSelUid, amount: amt }) });
    closeDeposit(); await loadSettlements();
  } catch (err) { e.textContent = err.error || "입금 확인 실패"; }
  finally { btn.disabled = false; }
}

// --- MYPAGE / NICKNAME ---
function toggleNameEdit() { document.getElementById("name-edit").classList.toggle("hidden"); document.getElementById("new-name").value = document.getElementById("my-name").textContent; document.getElementById("name-msg").innerHTML = ""; }
async function saveName() {
  const v = document.getElementById("new-name").value.trim();
  const m = document.getElementById("name-msg");
  if (v.length < 3 || v.length > 20 || !/^[A-Za-z0-9_-]+$/.test(v)) { m.innerHTML = '<p class="err">3~20자 영문/숫자/_/-</p>'; return; }
  try {
    await api("/api/me/username", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: v }) });
    document.getElementById("my-name").textContent = v; toggleNameEdit(); m.innerHTML = '<p class="ok">변경됨</p>';
  } catch (err) { m.innerHTML = `<p class="err">${err.status === 409 ? "이미 사용 중" : "실패"}</p>`; }
}
async function logout() {
  // Full reset on logout: clearing the Google consent forces the account picker next
  // time (not a silent auto-login), and clearing PIN/biometric re-enrolls the lock from
  // scratch on the next login. The picker's process-death risk is covered by
  // recoverGoogleLogin() on relaunch.
  await fullLogout();
  location.reload();
}

// --- NAV ---
function showView(v) {
  ["groups", "detail", "mypage"].forEach(s => document.getElementById("view-" + s).classList.add("hidden"));
  document.getElementById("view-" + v).classList.remove("hidden");
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + (v === "detail" ? "groups" : v)).classList.add("active");
  if (v === "groups") loadGroups();
  if (v === "mypage") syncLockSettings();
}

// --- APP UPDATE (GitHub Releases sideload distribution) ---
// No Play Store => no system in-app update. On launch we poll the GitHub "latest
// release" API; when the tag is newer than the installed versionName we show a
// blocking modal offering only "update" or "exit app" — the user cannot bypass it
// without one of those. The APK is downloaded through the native Updater plugin and
// handed to the Android package installer (REQUEST_INSTALL_PACKAGES).
const GH_REPO = "kimmaze027/Settlement";
const APK_URL = "https://github.com/" + GH_REPO + "/releases/latest/download/settlement.apk";
let appVersion = "0";
let updProgressWired = false;

async function getAppVersion() {
  try {
    const Updater = Capacitor.Plugins.Updater;
    if (Updater && Updater.getVersion) {
      const r = await Updater.getVersion();
      if (r && r.version) appVersion = r.version;
    }
  } catch {}
  return appVersion;
}

// 1 if a>b, -1 if a<b, 0 equal — compares dotted numeric versions, ignoring a leading "v".
function cmpVer(a, b) {
  const pa = String(a).replace(/^v/, "").split(".");
  const pb = String(b).replace(/^v/, "").split(".");
  const n = Math.max(pa.length, pb.length);
  for (let i = 0; i < n; i++) {
    const x = parseInt(pa[i]) || 0;
    const y = parseInt(pb[i]) || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

// Returns true when the forced update dialog was opened (caller must then STOP the
// normal startup flow so nothing — especially the biometric prompt — covers it).
async function checkForUpdate() {
  await getAppVersion();
  try {
    const r = await fetch("https://api.github.com/repos/" + GH_REPO + "/releases/latest", { cache: "no-store" });
    if (!r.ok) return false;
    const d = await r.json();
    if (cmpVer(d.tag_name || "", appVersion) > 0) { openUpdateModal(d.tag_name || ""); return true; }
  } catch {}
  return false;
}

function openUpdateModal(tag) {
  document.getElementById("upd-cur").textContent = "v" + appVersion;
  document.getElementById("upd-ver").textContent = tag;
  document.getElementById("upd-progress").classList.add("hidden");
  document.getElementById("upd-pct").style.width = "0%";
  document.getElementById("upd-pct-text").textContent = "";
  const btn = document.getElementById("upd-btn");
  btn.disabled = false;
  btn.textContent = "업데이트";
  document.getElementById("upd-modal").classList.remove("hidden");
}
function closeUpdateModal() { document.getElementById("upd-modal").classList.add("hidden"); }

async function startUpdate() {
  const Updater = Capacitor.Plugins.Updater;
  if (!Updater || !Updater.downloadAndInstall) { alert("이 환경에서는 지원되지 않습니다."); return; }
  const btn = document.getElementById("upd-btn");
  btn.disabled = true;
  btn.textContent = "다운로드 중…";
  document.getElementById("upd-progress").classList.remove("hidden");
  if (!updProgressWired) {
    Updater.addListener("updateProgress", (p) => {
      const pct = (p && p.percent) || 0;
      document.getElementById("upd-pct").style.width = pct + "%";
      document.getElementById("upd-pct-text").textContent = pct + "%";
    });
    updProgressWired = true;
  }
  try {
    await Updater.downloadAndInstall({ url: APK_URL });
    // Android's package installer is now foregrounded; close the modal so the user
    // doesn't return to a stale overlay after installing.
    closeUpdateModal();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "업데이트";
    document.getElementById("upd-progress").classList.add("hidden");
    alert("다운로드 실패: " + (e && e.message ? e.message : e));
  }
}

async function exitApp() {
  try { await Capacitor.Plugins.Updater.exitApp(); } catch {}
}

// --- START ---
(async () => {
  // UPDATE GATE FIRST: if a newer release exists, the forced update dialog must be
  // the only thing on screen — in particular the native biometric prompt must NOT
  // fire over it. Await the check (bounded to 3s so a slow network can't stall
  // entry); when it opened the dialog, stop here — the user updates or exits.
  let updating = false;
  try {
    updating = await Promise.race([
      checkForUpdate(),
      new Promise((res) => setTimeout(() => res(false), 3000)),
    ]);
  } catch {}
  if (updating) return;
  // If a previous Google login was interrupted by the OS killing the app while the
  // account picker was open, finish it silently before showing the login screen.
  const recovered = await recoverGoogleLogin();
  if (!recovered) await init();
})();
</script>
