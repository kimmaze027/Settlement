<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Settlement</title>
<style>
/* ===== Design tokens (4px-base spacing scale; all paddings/margins/gaps use it) ===== */
:root{
  --bg:#09090b;
  --surface:#18181b;
  --surface-2:#27272a;
  --line:#27272a;
  --line-strong:#3f3f46;
  --txt:#fafafa;
  --txt-mute:#a1a1aa;
  --txt-faint:#71717a;
  --accent:#10b981;
  --accent-2:#34d399;
  --danger:#f87171;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:28px; --s-8:32px;
  --r-sm:8px; --r-md:12px; --r-pill:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.6;-webkit-tap-highlight-color:transparent}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent-2);text-decoration:none}
.hidden{display:none!important}

/* ===== App shell ===== */
#app{max-width:500px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top)}
.screen-center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:var(--s-6) var(--s-4)}
.page-pad{padding:0 var(--s-4)}
.nav-clear{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.center{text-align:center}

/* ===== Typography ===== */
.h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.h2{font-size:16px;font-weight:600;color:var(--txt-mute);line-height:1.3}
.brand{font-size:28px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--txt-faint);font-size:12px}
.field-label{font-size:12px;color:var(--txt-faint);font-weight:500}
.fmt{color:var(--txt-faint);font-size:11px}
.pos{color:var(--accent-2)}
.neg{color:var(--danger)}
.amt{font-size:18px;font-weight:600}
.name-val{font-size:16px;font-weight:500}
.stl-title{font-size:15px;font-weight:500}

/* ===== Layout helpers ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}
.col,.stack{display:flex;flex-direction:column;gap:var(--s-3)}
.stack-sm{display:flex;flex-direction:column;gap:var(--s-2)}
.actions{display:flex;align-items:center;gap:var(--s-2)}
.actions-end{display:flex;align-items:center;gap:var(--s-2);justify-content:flex-end}
.seg{display:flex;gap:var(--s-2);flex-wrap:wrap}
.form-row{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.head-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);padding:var(--s-4) var(--s-4) var(--s-2)}
.back-row{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-4) 0 var(--s-2)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);margin-bottom:var(--s-3)}
.clickable{cursor:pointer}
.self-start{align-self:flex-start}
.mt1{margin-top:var(--s-1)} .mt2{margin-top:var(--s-2)} .mt3{margin-top:var(--s-3)} .mt4{margin-top:var(--s-4)} .mt5{margin-top:var(--s-5)}
.sep{border-top:1px solid var(--line);margin:var(--s-3) 0}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-4);margin-bottom:var(--s-3)}
.card:last-child{margin-bottom:0}
.details{margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--line)}

/* ===== Inputs ===== */
.input{width:100%;padding:var(--s-3) var(--s-4);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:rgba(255,255,255,.32)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.field{margin-bottom:var(--s-3)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-1);padding:var(--s-3) var(--s-5);border:1px solid var(--line-strong);background:transparent;color:var(--txt);border-radius:var(--r-md);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:rgba(255,255,255,.06)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#09090b;font-weight:600}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:var(--s-2) var(--s-3);font-size:12px;border-radius:var(--r-sm)}
.btn-block{display:flex;width:100%}
.btn.neg{color:var(--danger)}

/* ===== Badge / chip ===== */
.badge{display:inline-block;padding:2px var(--s-2);border-radius:var(--r-pill);font-size:11px;background:rgba(255,255,255,.1);color:var(--txt-mute)}
.deposit-pick{margin:0 var(--s-1) var(--s-1) 0;padding:var(--s-2) var(--s-3);border:1px solid var(--line);background:transparent;color:var(--txt-mute);border-radius:var(--r-pill);font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.deposit-pick.on{border-color:rgba(16,185,129,.4);color:var(--accent-2);background:rgba(16,185,129,.15)}

/* ===== Messages ===== */
.err{color:var(--danger);font-size:12px;padding:var(--s-1) 0}
.ok{color:var(--accent-2);font-size:12px;padding:var(--s-1) 0}
.list-empty{padding:var(--s-3) 0;color:var(--txt-faint);font-size:12px}

/* ===== Checkboxes ===== */
label.cb{display:flex;align-items:center;gap:var(--s-2);cursor:pointer;padding:var(--s-2) 0}
label.cb input{width:20px;height:20px;accent-color:var(--accent)}

/* ===== Bottom nav ===== */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:rgba(9,9,11,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;background:none;border:none;color:var(--txt-faint);padding:var(--s-2) 0;font-size:11px;font-weight:500;cursor:pointer;transition:color .15s}
.nav button svg{width:24px;height:24px}
.nav button.active{color:var(--accent-2);font-weight:600}
.nav button:active{opacity:.7}

/* ===== Push toast ===== */
.push-toast{position:fixed;top:0;left:0;right:0;max-width:500px;margin:0 auto;background:var(--accent);color:#09090b;padding:var(--s-3) var(--s-4);font-size:13px;font-weight:600;z-index:999;cursor:pointer}

/* ===== Update modal (self-update) ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:var(--s-4);z-index:1000}
.modal-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:var(--s-5);width:100%;max-width:340px;display:flex;flex-direction:column;gap:var(--s-2)}
.modal-wide{max-width:420px}
.upd-ver{font-size:18px;font-weight:600;color:var(--accent-2)}
.upd-vers{display:flex;flex-direction:column;gap:var(--s-2);margin:var(--s-1) 0}
.upd-progress{display:flex;flex-direction:column;gap:var(--s-1);margin-top:var(--s-1)}
.upd-bar{height:6px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.upd-fill{height:100%;width:0;background:var(--accent);border-radius:var(--r-pill);transition:width .2s}

/* ===== App lock (PIN keypad) ===== */
.pin-dots{display:flex;gap:var(--s-3);justify-content:center;margin:var(--s-5) 0 var(--s-4)}
.pin-dots .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-strong);transition:background .1s,border-color .1s}
.pin-dots .dot.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:var(--s-3);justify-content:center;margin-top:var(--s-4)}
.keypad .key{width:64px;height:64px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--txt);font-size:24px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s}
.keypad .key:active{background:rgba(255,255,255,.12)}
.keypad .key.key-blank{border:none;background:none;cursor:default}
.actions-center{display:flex;gap:var(--s-2);justify-content:center;flex-wrap:wrap}
.lock-link{background:none;border:none;color:var(--txt-faint);font-size:12px;cursor:pointer;padding:var(--s-2);text-decoration:underline}
</style>
</head>
<body>
<div id="app">
<!-- LOGIN SCREEN -->
<div id="screen-login" class="screen-center">
  <h1 class="brand center">Settlement</h1>
  <button id="google-btn" class="btn btn-primary btn-block mt4" onclick="googleLogin()">Google 로그인</button>
  <div id="google-err" class="err center mt2"></div>
</div>

<!-- LOCK SCREEN (biometric/PIN re-entry gate) -->
<div id="screen-lock" class="screen-center hidden">
  <h1 class="brand center">Settlement</h1>
  <p id="lock-msg" class="sub center mt2">PIN을 입력하세요</p>
  <div id="lock-dots" class="pin-dots"></div>
  <div id="lock-keypad" class="keypad"></div>
  <div class="actions-center mt3">
    <button id="lock-bio" class="btn btn-sm" onclick="lockBiometric()">지문 인증</button>
  </div>
  <button class="lock-link mt2" onclick="lockReset()">다른 계정으로 로그인</button>
  <div id="lock-err" class="err center mt2"></div>
</div>

<!-- PIN SETUP SCREEN (first-time enrollment) -->
<div id="screen-pinsetup" class="screen-center hidden">
  <h1 class="brand center">Settlement</h1>
  <p id="pinsetup-msg" class="sub center mt2">PIN을 설정하세요 (4자리)</p>
  <div id="pinsetup-dots" class="pin-dots"></div>
  <div id="pinsetup-keypad" class="keypad"></div>
  <label class="cb mt3" id="pinsetup-bio-wrap" style="justify-content:center"><input type="checkbox" id="pinsetup-bio"> 지문 인증 사용</label>
  <div id="pinsetup-err" class="err center mt2"></div>
</div>

<!-- MAIN APP -->
<div id="screen-main" class="hidden nav-clear">
  <!-- GROUPS -->
  <div id="view-groups">
    <div class="head-bar">
      <h1 class="h1">그룹</h1>
      <button class="btn btn-sm" onclick="toggleCreate()">+ 그룹 만들기</button>
    </div>
    <div id="create-form" class="card hidden stack-sm">
      <input id="gp-name" class="input" placeholder="그룹 이름">
      <button class="btn btn-primary btn-sm self-start" onclick="createGroup()">생성</button>
    </div>
    <div id="group-list" class="page-pad"></div>
  </div>

  <!-- GROUP DETAIL -->
  <div id="view-detail" class="hidden page-pad">
    <div class="back-row">
      <button class="btn btn-sm" onclick="showGroups()">← 뒤로</button>
    </div>
    <h1 class="h1" id="detail-name"></h1>
    <div class="sub" id="detail-members"></div>
    <div class="sep"></div>
    <!-- SETTLEMENT -->
    <div class="section-head">
      <h2 class="h2">정산</h2>
      <div class="row">
        <button class="btn btn-sm" id="btn-deposit" onclick="openDeposit()" style="display:none">입금 확인</button>
        <button class="btn btn-sm" onclick="toggleSettlementForm()">+ 정산 요청</button>
      </div>
    </div>
    <!-- deposit modal -->
    <div id="deposit-modal" class="hidden overlay" onclick="closeDeposit()">
      <div class="modal-card stack modal-wide" onclick="event.stopPropagation()">
        <div class="row"><span class="stl-title">입금 확인</span><span class="sub" onclick="closeDeposit()">✕</span></div>
        <div id="deposit-debtors"></div>
        <span class="sub" id="deposit-hint" style="display:none"></span>
        <input id="deposit-amount" class="input" placeholder="받은 금액 (원)" inputmode="numeric" oninput="this.value=this.value.replace(/[^\d]/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,',')">
        <div id="deposit-err" class="err"></div>
        <div class="actions"><button class="btn btn-primary" id="deposit-submit" onclick="submitDeposit()">확인</button><button class="btn" onclick="closeDeposit()">취소</button></div>
      </div>
    </div>
    <!-- balance -->
    <div class="card">
      <div class="row clickable" onclick="toggleDetails()">
        <div class="stack-sm"><span class="sub">받을 금액 ▾</span><span class="amt pos" id="bal-to"></span></div>
        <div class="stack-sm"><span class="sub">보낼 금액 ▾</span><span class="amt neg" id="bal-by"></span></div>
        <div class="stack-sm"><span class="sub">합계</span><span class="badge" id="bal-net"></span></div>

    </div>
    <!-- create form -->
    <div id="stl-form" class="card hidden stack">
      <input id="stl-total" class="input" placeholder="전체 금액 (원)" oninput="fmtTotal()">
      <input id="stl-merchant" class="input" placeholder="사용처">
      <input id="stl-reason" class="input" placeholder="사유">
      <div class="form-row"><span class="field-label">대상</span>
        <div class="seg">
          <button class="btn btn-sm" id="mode-all" onclick="setMode('all')">전체</button>
          <button class="btn btn-sm" id="mode-sel" onclick="setMode('selected')">선택</button>

      <div class="actions">
        <button class="btn btn-primary btn-sm" onclick="submitSettlement()">요청</button>

    </div>

  <!-- MYPAGE -->
  <div id="view-mypage" class="hidden page-pad">
    <h1 class="h1 mt4">내 정보</h1>
    <div class="card stack">
      <div class="row">
        <div class="stack-sm"><span class="sub">닉네임</span><span class="name-val" id="my-name"></span></div>
        <button class="btn btn-sm" onclick="toggleNameEdit()">변경</button>
      </div>
      <div id="name-edit" class="hidden stack">
        <input id="new-name" class="input" placeholder="새 닉네임 (3~20자)">
        <div class="actions">
          <button class="btn btn-primary btn-sm" onclick="saveName()">저장</button>
          <button class="btn btn-sm" onclick="toggleNameEdit()">취소</button>
        </div>
        <div id="name-msg"></div>
      </div>
    </div>
    <div class="card stack">
      <div class="row" id="bio-row">
        <span class="stl-title">생체인증</span>
        <label class="cb" style="padding:0"><input type="checkbox" id="bio-toggle" onchange="toggleBio()"> 사용</label>
      </div>
      <div class="row">
        <span class="stl-title">PIN 번호</span>
        <button class="btn btn-sm" onclick="changePin()">변경</button>
      </div>
    </div>
    <button class="btn btn-block mt4" onclick="logout()">로그아웃</button>
  </div>

  <!-- BOTTOM NAV -->
  <div class="nav">
    <button id="tab-groups" class="active" onclick="showView('groups')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>그룹</span>
    </button>
    <button id="tab-mypage" onclick="showView('mypage')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>내 정보</span>
    </button>
  </div>
</div>
<!-- UPDATE MODAL (self-update via GitHub Releases) -->

  <div class="modal-card">
    <h2 class="h2 center">새 버전이 있습니다</h2>
    <div class="upd-vers">
      <div class="row"><span class="sub">현재 버전</span><span id="upd-cur" class="name-val"></span></div>
      <div class="row"><span class="sub">최신 버전</span><span id="upd-ver" class="upd-ver"></span></div>
    </div>
    <div id="upd-progress" class="upd-progress hidden">
      <div class="upd-bar"><div id="upd-pct" class="upd-fill"></div></div>
      <span id="upd-pct-text" class="sub center"></span>
    </div>
    <button id="upd-btn" class="btn btn-primary btn-block" onclick="startUpdate()">업데이트</button>
    <button class="btn btn-sm" onclick="exitApp()">앱 종료</button>
  </div>
</div>
</div>

<script>
const API = "https://api.kimmiro.com";
let myId = null, currentGid = null, groupMembers = [], stlMode = "all", stlSplit = "equal", editingSid = null;

// --- API helpers ---
async function api(path, opts = {}) {
  const r = await fetch(`${API}${path}`, { ...opts, credentials: "include" });
  if (!r.ok && r.status !== 201) throw { status: r.status, ...(await r.json().catch(() => ({}))) };
  return r;
}
const won = n => "₩" + (n || 0).toLocaleString();
const esc = s => (s || "").replace(/</g, "&lt;");

// --- GOOGLE NATIVE LOGIN ---
// Why this is non-trivial: GoogleAuth.signIn() opens a separate system Activity
// (account picker). While it is foregrounded the app is backgrounded and Android
// frequently kills the app process to reclaim memory. The JS `await signIn()`
// promise is destroyed with the page, so the idToken never reaches the server, no
// session cookie is set, and the app relaunches to the login screen (looks like a
// crash). To survive this we record "in-flight" in Preferences and, on the next
// launch, silently recover the persisted native account via refresh().
const PREF_G_INFLIGHT = "google_login_inflight";
const pref = {
  get: (k) => Capacitor.Plugins.Preferences.get({ key: k }).then((r) => r.value),
  set: (k, v) => Capacitor.Plugins.Preferences.set({ key: k, value: v }),
  del: (k) => Capacitor.Plugins.Preferences.remove({ key: k }),
};

// Exchange a Google idToken for a session cookie, then enter the app.
async function completeGoogleLogin(idToken) {
  const res = await fetch(`${API}/api/auth/google/token`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: idToken }),
    credentials: "include",
  });
  if (!res.ok) throw new Error("server rejected token (" + res.status + ")");
  await init();
}

// Silent recovery for when a previous Google login was interrupted by process
// death. The native GoogleSignInClient keeps the signed-in account, so refresh()
// returns a fresh idToken with no UI. Returns true if the app ended up logged in.
async function recoverGoogleLogin() {
  if ((await pref.get(PREF_G_INFLIGHT)) !== "1") return false;
  try {
    const { GoogleAuth } = Capacitor.Plugins;
    await GoogleAuth.initialize();
    const auth = await GoogleAuth.refresh();
    const idToken = auth?.idToken;
    if (!idToken) throw new Error("no id_token on refresh");
    await completeGoogleLogin(idToken);
    await pref.del(PREF_G_INFLIGHT);
    return true;
  } catch {
    // Not actually signed in / revoked / network — clear the flag and fall through
    // to normal init() so the user lands on the login screen, not a silent loop.
    try { await pref.del(PREF_G_INFLIGHT); } catch {}
    return false;
  }
}

async function googleLogin() {
  const err = document.getElementById("google-err");
  err.textContent = "";
  try {
    const { GoogleAuth } = Capacitor.Plugins;
    await GoogleAuth.initialize();
    // Prefer SILENT sign-in first: refresh() (now backed by silentSignIn()) returns a fresh
    // idToken with NO UI. This avoids launching the system account-picker Activity, which
    // backgrounds the app and lets Android kill the process (the #1 cause of login silently
    // failing). Only when there is no cached consent (first-ever login / cleared data) do we
    // fall back to the interactive signIn() picker.
    let idToken = null;
    try {
      const silent = await GoogleAuth.refresh();
      idToken = silent?.idToken || null;
    } catch {}
    if (!idToken) {
      // Mark in-flight BEFORE leaving the app, so a mid-sign-in process kill is recoverable.
      await pref.set(PREF_G_INFLIGHT, "1");
      const result = await GoogleAuth.signIn();
      await pref.del(PREF_G_INFLIGHT);
      idToken = result.authentication?.idToken;
    }
    if (!idToken) throw { code: 0, message: "no id_token" };
    await completeGoogleLogin(idToken);
  } catch (e) {
    try { await pref.del(PREF_G_INFLIGHT); } catch {}
    const code = Number(e.code ?? e.status ?? -99);
    const msgs = {
      4: "구글 계정 선택 필요",
      5: "로그인 취소됨",
      7: "네트워크 오류",
      8: "Google Play Services 오류",
      10: "설정 오류 (DEVELOPER_ERROR) — Google Cloud Console에 SHA-1 지문 + 패키지명(com.kimmiro.app) 등록 필요",
      12500: "Google Play Services 버전 확인 필요",
      12501: "로그인 취소",
    };
    err.textContent = msgs[code] || ("구글 로그인 실패 [code=" + code + "]: " + (e.message || ""));
  }
}

// --- INIT ---
// After confirming a valid server session, entry is gated behind the local app lock
// (PIN, optional biometric) — NOT silent auto-login. First login forces PIN enrollment.
async function init() {
  try {
    const r = await api("/api/auth/me");
    const d = await r.json();
    if (d.username_customized === false) {
      // force nickname setup first
      const nn = prompt("닉네임을 설정하세요 (3~20자 영문/숫자/_/-)");
      if (nn) {
        await api("/api/me/username", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: nn.trim() }) });
      }
    }
    myId = d.id;
    document.getElementById("my-name").textContent = d.username;
    // Valid session: require a PIN (enroll on first login), then gate every reopen.
    const hash = await pref.get("pin_hash");
    if (!hash) showPinSetup();
    else showLock();
  } catch {
    // No valid session -> show the Google-only login screen.
    showScreen("login");
  }
}

// --- APP LOCK (biometric / PIN re-entry gate) ---
// The server session cookie proves the account; this local gate proves the device
// owner is present. PIN (SHA-256 hashed, stored in Preferences) is always available;
// biometric (BiometricPrompt) is an optional convenience that auto-prompts if enabled.
const PIN_LEN = 4;
let lockCtrl = null, pinSetupCtrl = null, pinSetupFirst = null, pinSetupMode = "enroll";

function showScreen(name) {
  ["login", "lock", "pinsetup", "main"].forEach(s => document.getElementById("screen-" + s).classList.add("hidden"));
  document.getElementById("screen-" + name).classList.remove("hidden");
}
function enterApp() {
  showScreen("main");
  // Deterministic entry state: show the groups view with its tab active (this also
  // loads groups). Without it the default markup could leave several views stacked.
  showView("groups");
  registerPush();
  syncLockSettings();
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "push-toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
// Enable biometric only after a successful in-app fingerprint check; persists the
// flag on success and clears it on any failure/cancel. Used at PIN enrollment and
// from the My Info toggle.
async function tryEnableBiometric() {
  try {
    await Capacitor.Plugins.Biometric.authenticate({ title: "Settlement", subtitle: "지문 인증" });
    await pref.set("biometric_enabled", "1");
    return true;
  } catch {
    await pref.set("biometric_enabled", "0");
    return false;
  }
}
// Reflect current biometric availability/enabled state into the My Info toggle.
async function syncLockSettings() {
  const avail = await bioAvailable();
  const row = document.getElementById("bio-row");
  if (row) row.style.display = avail ? "" : "none";
  if (avail) document.getElementById("bio-toggle").checked = (await pref.get("biometric_enabled")) === "1";
}
async function toggleBio() {
  const cb = document.getElementById("bio-toggle");
  const enabled = (await pref.get("biometric_enabled")) === "1";
  if (cb.checked && !enabled) {
    const ok = await tryEnableBiometric();
    cb.checked = ok;
    if (!ok) toast("지문 인증 실패 — 생체인증을 켜지 못했습니다");
  } else if (!cb.checked && enabled) {
    await pref.set("biometric_enabled", "0");
  }
}
function changePin() {
  showPinSetup("change");
}

async function pinHash(pin) {
  const data = new TextEncoder().encode("settlement-pin-v1:" + pin);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function bioAvailable() {
  try {
    const B = Capacitor.Plugins.Biometric;
    if (!B) return false;
    return !!(await B.isAvailable()).available;
  } catch { return false; }
}

// Renders a numeric keypad + PIN dots; calls onComplete(pin) when PIN_LEN digits entered.
function makePinInput(dotsId, keypadId, onComplete) {
  let entry = "";
  const dots = document.getElementById(dotsId);
  const kp = document.getElementById(keypadId);
  function render() {
    dots.innerHTML = Array.from({ length: PIN_LEN }, (_, i) => '<span class="dot ' + (i < entry.length ? "on" : "") + '"></span>').join("");
  }
  const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  kp.innerHTML = keys.map(k => k === "" ? '<button class="key key-blank" disabled></button>'
    : '<button class="key" data-k="' + k + '">' + (k === "del" ? "⌫" : k) + "</button>").join("");
  kp.querySelectorAll(".key[data-k]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k;
    if (k === "del") entry = entry.slice(0, -1);
    else if (entry.length < PIN_LEN) entry += k;
    render();
    if (entry.length === PIN_LEN) { const p = entry; entry = ""; render(); onComplete(p); }
  }));
  render();
  return { reset: () => { entry = ""; render(); } };
}

async function showLock() {
  showScreen("lock");
  document.getElementById("lock-err").textContent = "";
  document.getElementById("lock-msg").textContent = "PIN을 입력하세요";
  lockCtrl = makePinInput("lock-dots", "lock-keypad", onLockPin);
  const avail = await bioAvailable();
  const enabled = (await pref.get("biometric_enabled")) === "1";
  document.getElementById("lock-bio").style.display = avail ? "" : "none";
  if (avail && enabled) lockBiometric(); // auto-prompt when enabled
}
async function onLockPin(pin) {
  if ((await pinHash(pin)) === (await pref.get("pin_hash"))) {
    enterApp();
  } else {
    document.getElementById("lock-err").textContent = "PIN이 틀렸습니다";
    if (lockCtrl) lockCtrl.reset();
  }
}
async function lockBiometric() {
  try {
    await Capacitor.Plugins.Biometric.authenticate({ title: "Settlement", subtitle: "잠금 해제" });
    enterApp();
  } catch { /* canceled / failed -> stay on PIN entry */ }
}
// Wipes everything so the next login is from scratch: clears the Google consent (so the
// account picker shows again instead of a silent auto-login), the server session, and the
// local PIN/biometric lock.
async function fullLogout() {
  try { const { GoogleAuth } = Capacitor.Plugins; if (GoogleAuth) await GoogleAuth.signOut(); } catch {}
  try { await api("/api/auth/logout", { method: "POST" }); } catch {}
  try { await pref.del("pin_hash"); await pref.del("biometric_enabled"); } catch {}
}
async function lockReset() {
  // Full reset: Google consent + server session + local lock. Used for account switch or
  // forgotten-PIN recovery; the next login re-enrolls PIN from scratch.
  if (!confirm("로그아웃하고 PIN을 초기화할까요?")) return;
  await fullLogout();
  showScreen("login");
}

async function showPinSetup(mode) {
  pinSetupMode = mode || "enroll";
  showScreen("pinsetup");
  pinSetupFirst = null;
  document.getElementById("pinsetup-msg").textContent = pinSetupMode === "change" ? "새 PIN을 입력하세요 (4자리)" : "PIN을 설정하세요 (4자리)";
  document.getElementById("pinsetup-err").textContent = "";
  const wrap = document.getElementById("pinsetup-bio-wrap");
  if (pinSetupMode === "change") {
    wrap.style.display = "none";
  } else {
    const avail = await bioAvailable();
    wrap.style.display = avail ? "flex" : "none";
    document.getElementById("pinsetup-bio").checked = avail;
  }
  pinSetupCtrl = makePinInput("pinsetup-dots", "pinsetup-keypad", onPinSetup);
}
async function onPinSetup(pin) {
  const msg = document.getElementById("pinsetup-msg");
  const err = document.getElementById("pinsetup-err");
  if (!pinSetupFirst) {
    pinSetupFirst = pin;
    msg.textContent = "다시 한번 입력하세요";
    err.textContent = "";
    if (pinSetupCtrl) pinSetupCtrl.reset();
  } else if (pin === pinSetupFirst) {
    await pref.set("pin_hash", await pinHash(pin));
    pinSetupFirst = null;
    if (pinSetupMode === "enroll") {
      // If the user opted into biometric, verify it works once before relying on it;
      // on any failure the biometric option stays OFF (PIN remains the gate).
      if (document.getElementById("pinsetup-bio").checked && await bioAvailable()) {
        if (!(await tryEnableBiometric())) toast("지문 인증 실패 — 생체인증이 꺼졌습니다");
      } else {
        await pref.set("biometric_enabled", "0");
      }
      enterApp();
    } else {
      toast("PIN이 변경되었습니다");
      showScreen("main");
      showView("mypage");
    }
  } else {
    err.textContent = "PIN이 일치하지 않습니다. 다시 설정하세요.";
    pinSetupFirst = null;
    msg.textContent = "PIN을 설정하세요 (4자리)";
    if (pinSetupCtrl) pinSetupCtrl.reset();
  }
}

// --- PUSH NOTIFICATIONS ---
// Wires @capacitor/push-notifications to the backend FCM path:
//   1. request runtime permission (POST_NOTIFICATIONS, targetSdk 36)
//   2. register with FCM -> on "registration" send the token to
//      POST /api/me/device-token so the backend can target this device
//   3. on "pushNotificationReceived" show an in-app toast banner while open.
// NOTE: requires google-services.json in android/app/ (Firebase project wired
// to package com.kimmiro.app). Without it FirebaseApp is never initialized and
// PushNotifications.register() throws IllegalStateException. See HANDOFF.
async function registerPush() {
  try {
    const { PushNotifications } = Capacitor.Plugins;
    let perm = await PushNotifications.checkPermissions();
    if (perm.receive === "prompt") perm = await PushNotifications.requestPermissions();
    if (perm.receive !== "granted") return;
    await PushNotifications.register();
    PushNotifications.addListener("registration", async (token) => {
      try {
        await fetch(`${API}/api/me/device-token`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token.value, platform: "android" }),
          credentials: "include",
        });
      } catch {}
    });
    PushNotifications.addListener("pushNotificationReceived", (notification) => {
      if (notification.title) {
        const t = document.createElement("div");
        t.className = "push-toast";
        t.textContent = notification.title + (notification.body ? ": " + notification.body : "");
        t.onclick = () => { t.remove(); if (currentGid) loadSettlements(); };
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 5000);
      }
    });
  } catch {}
}

// --- SETTLEMENTS ---
async function loadSettlements() {
  if (!currentGid) return;
  try {
    const [br, lr] = await Promise.all([
      api(`/api/groups/${currentGid}/settlements/balance`),
      api(`/api/groups/${currentGid}/settlements`),
    ]);
    const b = await br.json(), l = await lr.json();
    document.getElementById("bal-to").textContent = won(b.owed_to_me);
    document.getElementById("bal-by").textContent = won(b.owed_by_me);
    const net = b.net || 0;
    document.getElementById("bal-net").textContent = (net >= 0 ? "+" : "") + won(net);
    // show/hide deposit button
    document.getElementById("btn-deposit").style.display = b.owed_to_me > 0 ? "" : "none";
    // details
    const det = document.getElementById("bal-details");
    let h = "";
    if (b.breakdown?.owed_to_me?.length) { h += '<span class="sub">내가 받을 돈</span>'; b.breakdown.owed_to_me.forEach(d => h += `<div class="row"><span class="sub">${esc(d.username)}에게서</span><span class="pos">${won(d.amount)}</span></div>`); }
    if (b.breakdown?.owed_by_me?.length) { h += '<span class="sub">내가 보낼 돈</span>'; b.breakdown.owed_by_me.forEach(d => h += `<div class="row"><span class="sub">${esc(d.username)}에게</span><span class="neg">${won(d.amount)}</span></div>`); }
    det.innerHTML = h;
    // list
    const ll = document.getElementById("stl-list");
    if (!l.settlements?.length) { ll.innerHTML = '<p class="list-empty">정산 요청이 없습니다.</p>'; return; }
    ll.innerHTML = l.settlements.map(s => {
      const mine = s.requester_user_id === myId;
      return `<div class="card stack">
        <div class="row"><span class="stl-title">${esc(s.merchant)}</span><span class="badge">${s.target_mode === "all" ? "전체" : "선택"}</span>${s.has_receipt ? '<span class="badge">영수증</span>' : ""}</div>
        <span class="amt">${won(s.total_amount)}</span>
        <span class="sub">${esc(s.reason)} · ${esc(s.requester_username)}${s.my_share > 0 ? ' · <span class="neg">내 몫 ' + won(s.my_share) + "</span>" : ""}</span>
        ${mine ? `<div class="actions mt1"><button class="btn btn-sm" onclick="editSettlement(${s.id},'${esc(s.merchant)}',${s.total_amount},'${esc(s.reason)}','${s.target_mode}')">수정</button><button class="btn btn-sm neg" onclick="delSettlement(${s.id})">삭제</button></div>` : ""}
      </div>`;
    }).join("");
  } catch {}
}
function toggleDetails() { document.getElementById("bal-details").classList.toggle("hidden"); }
function toggleSettlementForm() {
  const f = document.getElementById("stl-form");
  f.classList.toggle("hidden");
  if (!f.classList.contains("hidden")) { editingSid = null; ["stl-total","stl-merchant","stl-reason"].forEach(i => document.getElementById(i).value = ""); document.getElementById("stl-err").innerHTML = ""; setMode("all"); }
}
function fmtTotal() {
  const el = document.getElementById("stl-total");
  const raw = el.value.replace(/[^\d]/g, "");
  el.value = raw ? Number(raw).toLocaleString() : "";
}
function setMode(m) {
  stlMode = m;
  document.getElementById("mode-all").className = "btn btn-sm" + (m === "all" ? " btn-primary" : "");
  document.getElementById("mode-sel").className = "btn btn-sm" + (m === "selected" ? " btn-primary" : "");
  renderMemberList();
}
function setSplit(s) {
  stlSplit = s;
  document.getElementById("split-eq").className = "btn btn-sm" + (s === "equal" ? " btn-primary" : "");
  document.getElementById("split-cu").className = "btn btn-sm" + (s === "custom" ? " btn-primary" : "");
  renderMemberList();
}
function renderMemberList() {
  const el = document.getElementById("member-list");
  if (stlMode !== "selected") { el.innerHTML = ""; return; }
  const total = parseInt(document.getElementById("stl-total").value.replace(/[^\d]/g, "")) || 0;
  const checked = Array.from(el.querySelectorAll("input:checked")).map(c => parseInt(c.value));
  el.innerHTML = groupMembers.map(m => {
    const isC = stlMode === "selected" ? checked.includes(m.user_id) : true;
    let amt = "";
    if (stlSplit === "equal" && isC && checked.length) amt = `<span class="fmt">${won(Math.floor(total / checked.length))}</span>`;
    return `<label class="cb"><input type="checkbox" value="${m.user_id}" ${isC ? "checked" : ""} onchange="renderMemberList()">${esc(m.username)} ${amt}</label>`;
  }).join("");
}
async function submitSettlement() {
  const e = document.getElementById("stl-err"); e.innerHTML = "";
  const total = parseInt(document.getElementById("stl-total").value.replace(/[^\d]/g, "")) || 0;
  const merchant = document.getElementById("stl-merchant").value.trim();
  const reason = document.getElementById("stl-reason").value.trim();
  if (!total || !merchant) { e.innerHTML = "금액/사용처를 입력하세요"; return; }
  const body = { total_amount: total, merchant, reason, target_mode: stlMode };
  if (stlMode === "selected") {
    const checked = Array.from(document.querySelectorAll("#member-list input:checked")).map(c => parseInt(c.value));
    if (!checked.length) { e.innerHTML = "대상을 선택하세요"; return; }
    if (stlSplit === "equal") {
      const base = Math.floor(total / checked.length), rem = total - base * checked.length;
      body.splits = checked.map((uid, i) => ({ user_id: uid, amount: base + (i < rem ? 1 : 0) }));
    } else {
      const inputs = document.querySelectorAll("#member-list input:checked");
      body.splits = []; let sum = 0;
      inputs.forEach(inp => {
        const uid = parseInt(inp.value);
        const am = parseInt(prompt(`${inp.parentElement.textContent.trim().split(/\s/)[0]}의 금액:`) || "0") || 0;
        body.splits.push({ user_id: uid, amount: am }); sum += am;
      });
      if (sum !== total) { e.innerHTML = `합계 ${won(sum)} ≠ ${won(total)}`; return; }
    }
  }
  try {
    const m = editingSid ? "PUT" : "POST";
    const p = editingSid ? `/api/groups/${currentGid}/settlements/${editingSid}` : `/api/groups/${currentGid}/settlements`;
    await api(p, { method: m, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    toggleSettlementForm(); await loadSettlements();
  } catch (err) { e.innerHTML = err.error || "실패"; }
}
function editSettlement(sid, merchant, total, reason, mode) {
  editingSid = sid;
  document.getElementById("stl-total").value = total.toLocaleString();
  document.getElementById("stl-merchant").value = merchant;
  document.getElementById("stl-reason").value = reason;
  setMode(mode);
  document.getElementById("stl-form").classList.remove("hidden");
}
async function delSettlement(sid) {
  if (!confirm("삭제할까요?")) return;
  try { await api(`/api/groups/${currentGid}/settlements/${sid}`, { method: "DELETE" }); await loadSettlements(); } catch {}
}
let depositSelectedUid = null;
async function openDeposit() {
  const res = await api(`/api/groups/${currentGid}/settlements/balance`);
  const b = await res.json();
  const debtors = b.breakdown?.owed_to_me || [];
  if (!debtors.length) { alert("받을 금액이 없습니다."); return; }
  depositSelectedUid = debtors[0].user_id;
  const dd = document.getElementById("deposit-debtors");
  dd.innerHTML = '<span class="sub">받은 사람</span>' +
    debtors.map(d => `<button class="deposit-pick" data-uid="${d.user_id}" onclick="pickDebtor(${d.user_id})">${esc(d.username)} (${won(d.amount)})</button>`).join("");
  pickDebtor(depositSelectedUid);
  document.getElementById("deposit-amount").value = "";
  document.getElementById("deposit-err").innerHTML = "";
  document.getElementById("deposit-modal").classList.remove("hidden");
}
function pickDebtor(uid) {
  depositSelectedUid = uid;
  document.querySelectorAll(".deposit-pick").forEach(b => {
    const on = parseInt(b.dataset.uid) === uid;
    b.classList.toggle("on", on);
  });
  const hint = document.getElementById("deposit-hint");
  const res = document.querySelector(`.deposit-pick[data-uid="${uid}"]`);
  if (res) { hint.textContent = res.textContent.replace(/.*\((.*)\)/, "받을 금액: $1"); hint.style.display = ""; }
}
function closeDeposit() { document.getElementById("deposit-modal").classList.add("hidden"); }
async function submitDeposit() {
  const e = document.getElementById("deposit-err"); e.innerHTML = "";
  const amt = parseInt(document.getElementById("deposit-amount").value.replace(/[^\d]/g, "")) || 0;
  if (!depositSelectedUid || amt <= 0) { e.innerHTML = "멤버와 금액을 입력하세요"; return; }
  try {
    const res = await api(`/api/groups/${currentGid}/settlements/payment`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from_user_id: depositSelectedUid, amount: amt }),
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); e.innerHTML = d.error || "실패"; return; }
    closeDeposit(); await loadSettlements();
  } catch (err) { e.innerHTML = "서버 연결 실패"; }
}

// --- APP UPDATE (GitHub Releases sideload distribution) ---
// No Play Store => no system in-app update. On launch we poll the GitHub "latest
// release" API; when the tag is newer than the installed versionName we show a
// blocking modal offering only "update" or "exit app" — the user cannot bypass it
// without one of those. The APK is downloaded through the native Updater plugin and
// handed to the Android package installer (REQUEST_INSTALL_PACKAGES).
const GH_REPO = "kimmaze027/Settlement";
const APK_URL = "https://github.com/" + GH_REPO + "/releases/latest/download/settlement.apk";
let appVersion = "0";
let updProgressWired = false;

async function getAppVersion() {
  try {
    const Updater = Capacitor.Plugins.Updater;
    if (Updater && Updater.getVersion) {
      const r = await Updater.getVersion();
      if (r && r.version) appVersion = r.version;
    }
  } catch {}
  return appVersion;
}

// 1 if a>b, -1 if a<b, 0 equal — compares dotted numeric versions, ignoring a leading "v".
function cmpVer(a, b) {
  const pa = String(a).replace(/^v/, "").split(".");
  const pb = String(b).replace(/^v/, "").split(".");
  const n = Math.max(pa.length, pb.length);
  for (let i = 0; i < n; i++) {
    const x = parseInt(pa[i]) || 0;
    const y = parseInt(pb[i]) || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

async function checkForUpdate() {
  await getAppVersion();
  try {
    const r = await fetch("https://api.github.com/repos/" + GH_REPO + "/releases/latest", { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (cmpVer(d.tag_name || "", appVersion) > 0) openUpdateModal(d.tag_name || "");
  } catch {}
}

function openUpdateModal(tag) {
  document.getElementById("upd-cur").textContent = "v" + appVersion;
  document.getElementById("upd-ver").textContent = tag;
  document.getElementById("upd-progress").classList.add("hidden");
  document.getElementById("upd-pct").style.width = "0%";
  document.getElementById("upd-pct-text").textContent = "";
  const btn = document.getElementById("upd-btn");
  btn.disabled = false;
  btn.textContent = "업데이트";
  document.getElementById("upd-modal").classList.remove("hidden");
}
function closeUpdateModal() { document.getElementById("upd-modal").classList.add("hidden"); }

async function startUpdate() {
  const Updater = Capacitor.Plugins.Updater;
  if (!Updater || !Updater.downloadAndInstall) { alert("이 환경에서는 지원되지 않습니다."); return; }
  const btn = document.getElementById("upd-btn");
  btn.disabled = true;
  btn.textContent = "다운로드 중…";
  document.getElementById("upd-progress").classList.remove("hidden");
  if (!updProgressWired) {
    Updater.addListener("updateProgress", (p) => {
      const pct = (p && p.percent) || 0;
      document.getElementById("upd-pct").style.width = pct + "%";
      document.getElementById("upd-pct-text").textContent = pct + "%";
    });
    updProgressWired = true;
  }
  try {
    await Updater.downloadAndInstall({ url: APK_URL });
    // Android's package installer is now foregrounded; close the modal so the user
    // doesn't return to a stale overlay after installing.
    closeUpdateModal();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "업데이트";
    document.getElementById("upd-progress").classList.add("hidden");
    alert("다운로드 실패: " + (e && e.message ? e.message : e));
  }
}

async function exitApp() {
  try { await Capacitor.Plugins.Updater.exitApp(); } catch {}
}

// --- START ---
(async () => {
  // Check for a newer release immediately, independent of login state, so the forced
  // update dialog appears right on the login screen. Non-blocking.
  checkForUpdate();
  // If a previous Google login was interrupted by the OS killing the app while the
  // account picker was open, finish it silently before showing the login screen.
  const recovered = await recoverGoogleLogin();
  if (!recovered) await init();
})();
</script>
